
loki:
  auth_enabled: false

  pattern_ingester:
    enabled: true
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 672h

  schemaConfig:
    configs:
    - from: "2020-12-11"
      store: tsdb
      object_store: s3
      schema: v13
      index:
        period: 24h
        prefix: index_

  compactor:
    retention_enabled: true
    delete_request_store: s3

  storage:
    type: s3
    use_thanos_objstore: true
    bucketNames:
      chunks: ${LOKI_BUCKET}
      ruler: ${LOKI_BUCKET}
      admin: ${LOKI_BUCKET}
    object_store:
      type: s3
      storage_prefix: loki-ruler
      s3:
        endpoint: ${LOKI_ENDPOINT}
        region: auto
        access_key_id: ${LOKI_ACCESS_KEY_ID}
        secret_access_key: ${LOKI_ACCESS_SECRET_KEY}
        insecure: false

  storage_config:
    use_thanos_objstore: true
    object_store:
      storage_prefix: loki
      s3:
        bucket_name: ${LOKI_BUCKET}
        endpoint: ${LOKI_ENDPOINT}
        region: auto
        access_key_id: ${LOKI_ACCESS_KEY_ID}
        secret_access_key: ${LOKI_ACCESS_SECRET_KEY}
        insecure: false

  ruler:
    enable_api: true
    alertmanager_url: http://alertmanager-operated.monitoring:9093

  ingester:
    chunk_encoding: snappy

  tracing:
    enabled: true

  querier:
    # Default is 4, if you have enough memory and CPU you can increase, reduce if OOMing
    max_concurrent: 4

deploymentMode: Distributed

ingester:
  replicas: 3
  zoneAwareReplication:
    enabled: false
querier:
  replicas: 3
  maxUnavailable: 2
queryFrontend:
  replicas: 2
  maxUnavailable: 1
queryScheduler:
  replicas: 2
distributor:
  replicas: 3
  maxUnavailable: 2
compactor:
  replicas: 1
indexGateway:
  replicas: 2
  maxUnavailable: 1
ruler:
 replicas: 1
 maxUnavailable: 1

# optional experimental components
bloomPlanner:
  replicas: 0
bloomBuilder:
  replicas: 0
bloomGateway:
  replicas: 0

# Zero out replica counts of other deployment modes
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

singleBinary:
  replicas: 0

monitoring:
  dashboards:
    enabled: true
    namespace: monitoring
  serviceMonitor:
    enabled: true