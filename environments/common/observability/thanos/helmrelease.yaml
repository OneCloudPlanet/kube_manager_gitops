apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: thanos
spec:
  releaseName: thanos
  chart:
    spec:
      chart: thanos
      version: 15.7.0
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: monitoring
  interval: 1h0m0s
  timeout: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: thanos-values
