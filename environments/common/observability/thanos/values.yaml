global:
  security:
    allowInsecureImages: true

image:
  registry: quay.io
  repository: thanos/thanos
  tag: v0.39.2

existingObjstoreSecret: "prometheus-stack-kube-prom-prometheus"
existingObjstoreSecretItems: 
    - key: object-storage-configs.yaml
      path: objstore.yml
storegateway:
  enabled: true
  podAnnotations:
    sidecar.istio.io/inject: "false"
  extraFlags:
    - "--block-sync-concurrency=2"
    - "--store.grpc.series-max-concurrency=10"
    - "--store.enable-index-header-lazy-reader"
  startupProbe:
    enabled: true
    initialDelaySeconds: 60
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 60
    successThreshold: 1
  livenessProbe:
    enabled: true
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 20
    successThreshold: 1
  readinessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 40
    successThreshold: 1
queryFrontend:
  replicaCount: 2
query:
  replicaCount: 2
  dnsDiscovery:
    enabled: true
    sidecarsService: "prometheus-stack-kube-prom-thanos-discovery"
    sidecarsNamespace: "monitoring"
compactor:
  enabled: true
  retentionResolutionRaw: 10d
  retentionResolution5m: 10d
  retentionResolution1h: 10y
  persistence:
    size: 30Gi
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
