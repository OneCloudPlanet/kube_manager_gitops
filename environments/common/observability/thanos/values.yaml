image:
  registry: quay.io
  repository: thanos/thanos
  tag: v0.35.1

existingObjstoreSecret: "prometheus-stack-kube-prom-prometheus"
existingObjstoreSecretItems: 
    - key: object-storage-configs.yaml
      path: objstore.yml
storegateway:
  enabled: true
  podAnnotations:
    sidecar.istio.io/inject: "false"
  extraFlags:
    - "--block-sync-concurrency=4"
    - "--store.grpc.series-max-concurrency=10"
  readinessProbe:
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1
queryFrontend:
  replicaCount: 2
query:
  replicaCount: 2
  dnsDiscovery:
    enabled: true
    sidecarsService: "prometheus-stack-kube-prom-thanos-discovery"
    sidecarsNamespace: "monitoring"
compactor:
  enabled: true
  retentionResolutionRaw: 10d
  retentionResolution5m: 10d
  retentionResolution1h: 10y
  persistence:
    size: 30Gi
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
