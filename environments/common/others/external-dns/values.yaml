provider:
  name: cloudflare

env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-api-token
        key: api-token

extraArgs:
  - --cloudflare-proxied
  - --txt-owner-id=${ENVIRONMENT}-external-dns

domainFilters:
  - "${DOMAIN}"

sources:
  - istio-virtualservice