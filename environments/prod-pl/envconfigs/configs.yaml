apiVersion: v1
kind: ConfigMap
metadata:
  name: environment-configs
  namespace: flux-system
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: merge
data:
  DOMAIN: "ocplanet.cloud"
  PROJECT: "kube-manager"
  ENVIRONMENT: "kube-pl"
  HOST: "k8s-pl.ocplanet.cloud"
  EMAIL_DOMAIN: "info@onecloudplanet.com"
  CLOUDFLARE_EMAIL: "info@onecloudplanet.com"
  ISTIO_VERSION: "1.24.2"
  # ── DB backups
  CNPG_BUCKET: "k8s-pl-backup"
  CNPG_ENDPOINTURL: "https://k8s-pl-backup.s3.ua-central-1.ocplanet.cloud"
  # ── Loki
  LOKI_BUCKET: "k8s-pl-metrics"
  LOKI_ENDPOINT: "s3.ua-central-1.ocplanet.cloud"
  # ── Tempo
  TEMPO_S3_BUCKET: "k8s-pl-metrics"
  TEMPO_S3_ENDPOINT: "s3.ua-central-1.ocplanet.cloud"
  # ── Thanos
  THANOS_BUCKET: "k8s-pl-metrics"
  THANOS_ENDPOINT: "s3.ua-central-1.ocplanet.cloud"
