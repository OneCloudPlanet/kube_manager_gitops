apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: 7-envspecific
  namespace: flux-system
spec:
  dependsOn:
    - name: 0-envconfigs
    - name: 5-infra
    - name: 6-data
    - name: 2-istio-ingress
    - name: 4-observability
  interval: 10m0s
  wait: true
  timeout: 30m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./environments/prod-nl/envspecific
  prune: false
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
  postBuild:
